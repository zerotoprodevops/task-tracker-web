<!DOCTYPE html>
<html>
<head <meta charset="UTF-8">
    <title>Task Tracker</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        .task { padding: 10px; border-bottom: 1px solid #ccc; width: 300px; margin: 0 auto; }
    </style>
</head>
<body>
    <h1>My Task Tracker</h1>
    <input type="text" id="taskInput" placeholder="Enter a new task">
    <button onclick="addTask()">Add Task</button>
    <div id="taskList"></div>

    <script>
        // Note: We call the API service name here
        const API_URL = 'http://api-service:5000/tasks';

        async function fetchTasks() {
            const res = await fetch(API_URL);
            const tasks = await res.json();
            const list = document.getElementById('taskList');
            list.innerHTML = tasks.map(t => `<div class="task">${t.title} - ${t.completed ? '✅' : '❌'}</div>`).join('');
        }

        async function addTask() {
            const title = document.getElementById('taskInput').value;
            if (!title) return;
            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title })
            });
            document.getElementById('taskInput').value = '';
            fetchTasks();
        }

        fetchTasks();
    </script>
</body>
</html>
